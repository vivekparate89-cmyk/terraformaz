trigger:
- main

pool:
  vmImage: ubuntu-latest

steps:

# 1. Repository checkout
- checkout: self

# 2. Check Terraform installation and find .tf files
- script: |
    terraform version

    echo "Searching for Terraform files..."
    TF_DIR=$(dirname "$(find "$(System.DefaultWorkingDirectory)" -type f -name "*.tf" | head -n 1)")

    echo "Terraform directory: $TF_DIR"

    if [ ! -f "$TF_DIR/main.tf" ]; then
      echo "No Terraform configuration found!"
      exit 1
    fi

    echo "$TF_DIR" > /tmp/tf_dir.txt
  displayName: Find Terraform Files

# 3. Terraform Init
- script: |
    TF_DIR=$(cat /tmp/tf_dir.txt)

    cd "$TF_DIR"
    terraform init
  displayName: Terraform Init

# 4. Terraform Validate
- script: |
    TF_DIR=$(cat /tmp/tf_dir.txt)

    cd "$TF_DIR"
    terraform validate
  displayName: Terraform Validate

# 5. Terraform Plan
- script: |
    TF_DIR=$(cat /tmp/tf_dir.txt)

    cd "$TF_DIR"
    terraform plan -out=tfplan
  displayName: Terraform Plan

# 6. Terraform Apply
- script: |
    TF_DIR=$(cat /tmp/tf_dir.txt)

    cd "$TF_DIR"
    terraform apply -auto-approve tfplan
  displayName: Terraform Apply